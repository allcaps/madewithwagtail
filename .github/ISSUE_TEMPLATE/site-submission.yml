name: Site submission
description: Propose a site built with Wagtail for the showcase
body:
  - type: input
    id: site-url
    attributes:
      label: Site URL
      description: The public URL of the site, e.g. https://example.com
    validations:
      required: true
  - type: input
    id: site-title
    attributes:
      label: Site title
      description: The site's name, as it should appear in the showcase (max 80 characters)
    validations:
      required: true
  - type: textarea
    id: site-description
    attributes:
      label: Short description
      description: 2–3 sentences describing the site (max 800 characters)
    validations:
      required: true
  - type: dropdown
    id: sector
    attributes:
      label: Sector
      description: What the site's organisation does — choose all that apply (optional)
      multiple: true
      options:
        - agriculture
        - arts
        - climate
        - consumer
        - culture
        - education
        - energy
        - engineering
        - entertainment
        - environment
        - finance
        - food
        - forestry
        - games
        - government
        - healthcare
        - hospitality
        - industry
        - non-profit
        - professional services
        - research
        - retail
        - science
        - sport
        - sustainability
        - technology
        - telecom
        - travel
    validations:
      required: false
  - type: dropdown
    id: site-type
    attributes:
      label: Site type
      description: What kind of site it is for its users — choose all that apply (optional)
      multiple: true
      options:
        - blog
        - documentation
        - e-commerce
        - events
        - news
        - portfolio
        - product
        - reports
    validations:
      required: false
  - type: dropdown
    id: capability
    attributes:
      label: Capabilities
      description: What the build achieved — choose all that apply (optional)
      multiple: true
      options:
        - 3D
        - booking
        - chatbot
        - headless
        - maps
        - multilingual
        - multisite
    validations:
      required: false
  - type: input
    id: developer-name
    attributes:
      label: Developer name
      description: 'The agency or developer that built the site (max 80 characters). If it exactly matches an existing profile, the site is added to that profile — otherwise a new profile is created. To add a site to an existing profile, use the name exactly as it appears on the site and skip the other developer fields.'
    validations:
      required: true
  - type: input
    id: developer-url
    attributes:
      label: Developer URL
      description: Optional - the developer's website
    validations:
      required: false
  - type: input
    id: developer-location
    attributes:
      label: Developer location
      description: Optional - For example 'Stockholm, Sweden', max 100 characters
    validations:
      required: false
  - type: input
    id: latitude
    attributes:
      label: Latitude
      description: Optional - Decimal degrees, e.g. 59.3427
    validations:
      required: false
  - type: input
    id: longitude
    attributes:
      label: Longitude
      description: Optional - Decimal degrees, e.g. 18.0612
    validations:
      required: false
  - type: input
    id: github-user
    attributes:
      label: GitHub username
      description: Optional - the developer's GitHub username
    validations:
      required: false
  - type: input
    id: logo-url
    attributes:
      label: Logo URL
      description: Optional - direct URL to the developer's logo (otherwise we'll look on the developer's site from the Developer URL)
    validations:
      required: false
  - type: textarea
    id: other-notes
    attributes:
      label: Other notes
      description: Optional - anything else you'd like us to know about this submission
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I am affiliated with this site or have permission to submit it.
          required: true
        - label: This is a production website built with Wagtail.
          required: true
